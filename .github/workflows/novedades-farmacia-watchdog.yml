name: Novedades Farmacia Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: novedades-farmacia-watchdog
  cancel-in-progress: false

jobs:
  ejecutar-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar secretos
        env:
          JOB_URL: ${{ secrets.NOVEDADES_JOB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$JOB_URL" ]; then
            echo "Falta el secreto NOVEDADES_JOB_URL"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET"
            exit 1
          fi

      - name: Ejecutar chequeo de novedades farmacia sin gestionar
        env:
          JOB_URL: ${{ secrets.NOVEDADES_JOB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$JOB_URL"